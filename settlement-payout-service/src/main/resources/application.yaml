server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}
  config:
    import: optional:classpath:application-local.yaml
  data:
    mongodb:
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: ${RABBITMQ_LISTENER_SIMPLE_ACKNOWLEDGE_MODE}
        default-requeue-rejected: ${RABBITMQ_LISTENER_SIMPLE_DEFAULT_REQUEUE_REJECTED}
  mongodb:
    uri: ${MONGODB_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info

settlement:
  broker:
    exchange: ${SETTLEMENT_BROKER_EXCHANGE}
    dlq-exchange: ${SETTLEMENT_BROKER_DLQ_EXCHANGE}
    settlement-requested-queue: ${SETTLEMENT_REQUESTED_QUEUE}
    settlement-requested-routing-key: ${SETTLEMENT_REQUESTED_ROUTING_KEY}
    settlement-completed-routing-key: ${SETTLEMENT_COMPLETED_ROUTING_KEY}
    settlement-failed-routing-key: ${SETTLEMENT_FAILED_ROUTING_KEY}
  dedup:
    ttl-hours: ${SETTLEMENT_DEDUP_TTL_HOURS}
