server:
  port: 8081

spring:
  application:
    name: ingestion
  config:
    import: optional:classpath:application-local.yaml
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: ${REDIS_TIMEOUT}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE}
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS}
    template:
      mandatory: ${RABBITMQ_TEMPLATE_MANDATORY}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, threaddump
  info:
    env:
      enabled: true

claims:
  broker:
    exchange: claims.events.topic
    dlq-exchange: claims.events.dlx
    claim-submitted-routing-key: claim.submitted
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
    max-retries: 5
  idempotency:
    redis-ttl-hours: 24
  
# Info actuator endpoint data
info:
  app:
    name: Claims Ingestion Service 
    description: A microservice that consumes claims and prepares an intake summary flow.
    version: 1.1.0
  api:
    host: localhost 
    port: 8081
    version: v1 
  support:
    name: Aman Raj
    email: amanrajmathematics@gmail.com 